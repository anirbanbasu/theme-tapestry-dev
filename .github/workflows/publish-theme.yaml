name: Publish theme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout monorepo at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monorepo

      - name: Checkout tapestry (distribution repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anirbanbasu/tapestry
          ssh-key: ${{ secrets.TAPESTRY_DEPLOY_KEY }}
          path: tapestry
          fetch-depth: 0

      - name: Sync theme files into the distribution checkout
        run: |
          rsync -a --delete --exclude='.git' monorepo/themes/tapestry/ tapestry/

      - name: Commit and push the release as a single squashed commit
        working-directory: tapestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes for ${RELEASE_TAG}; nothing to publish."
            exit 0
          fi
          git commit -m "Release ${RELEASE_TAG}"
          git tag "${RELEASE_TAG}"
          git push origin HEAD:master
          git push origin "${RELEASE_TAG}"
