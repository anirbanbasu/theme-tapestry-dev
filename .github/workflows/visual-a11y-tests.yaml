name: Visual & accessibility tests

on:
  pull_request:
    branches:
      - master
    paths:
      - "themes/tapestry/**"
      - "content/warp-and-weft/**"
      - "tests/**"
      - "config.toml"

permissions:
  contents: read

concurrency:
  group: "visual-a11y-${{ github.ref }}"
  cancel-in-progress: true

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  check:
    name: zola check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/zola
          zola --version
      - name: zola check
        run: zola check

  build:
    name: zola build
    runs-on: ubuntu-latest
    # Deliberately not `needs: check`: a flaky external-link failure in
    # `zola check` must not skip the whole visual/a11y suite. `check` still
    # fails the run on its own.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/zola
          zola --version
      - name: zola build (local base URL for CI-served tests)
        run: zola build --base-url http://127.0.0.1:1111
      - name: Upload public/ artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zola-public
          path: public/
          retention-days: 1

  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: [scholarly, creative, natural, precision, collective]
    defaults:
      run:
        working-directory: tests/visual-a11y
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download public/ artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zola-public
          path: public/
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/visual-a11y/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run accessibility sweep for this group
        env:
          STYLE_GROUP: ${{ matrix.group }}
        run: npx playwright test tests/a11y.spec.ts
      - name: Run visual regression for this group
        env:
          STYLE_GROUP: ${{ matrix.group }}
        run: npx playwright test tests/visual.spec.ts
      - name: Run keyboard-only checks for this group
        env:
          STYLE_GROUP: ${{ matrix.group }}
        run: npx playwright test tests/keyboard.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.group }}
          path: tests/visual-a11y/playwright-report/
          retention-days: 7
