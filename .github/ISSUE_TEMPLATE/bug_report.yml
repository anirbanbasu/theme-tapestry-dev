name: Bug report
description: Something in the theme isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this is an accessibility problem, a terminus-compatibility mismatch, or a request for a new presentation style, please use one of the other templates instead — they capture the details those cases need.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the page/URL, and the exact template/shortcode/config involved if known.
      placeholder: |
        1. Set `extra.presentation_style = "..."` / `extra.presentation_variant = "..."`
        2. Visit ...
        3. See error
    validations:
      required: true
  - type: input
    id: style-variant
    attributes:
      label: Presentation style / variant
      description: e.g. scholarly / contemporary-research-lab. Leave blank if not style-specific.
  - type: dropdown
    id: color-mode
    attributes:
      label: Colour mode
      options:
        - Light
        - Dark
        - Both / not applicable
    validations:
      required: true
  - type: input
    id: zola-version
    attributes:
      label: Zola version
      description: Output of `zola --version`. The pinned version is 0.22.1 (CONSTITUTION.md §3).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Firefox 128 on macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Relevant build output, console errors, or screenshots
      render: shell
